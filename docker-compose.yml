version: "3.8"
services:
  backend:
    container_name: backend
    build: ./backend
    # Inject environment variables from the .env file in the backend directory
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"  

  client:
    container_name: client
    build: ./client
    env_file:
      - ./client/.env
    ports:
      - "5173:5173"